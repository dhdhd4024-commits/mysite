<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Наш сайт</title>
<style>
body{
   margin:0;
   min-height:100vh;
   font-family:Arial;
   color:white;
   text-align:center;

   overflow-x:hidden;
   overflow-y:auto;

   position:relative;
   -webkit-text-size-adjust:100%;
   background:
      radial-gradient(circle at 20% 20%, #1b1b3a, transparent 40%),
      radial-gradient(circle at 80% 30%, #2a0f3a, transparent 45%),
      radial-gradient(circle at 50% 80%, #001b2e, transparent 50%),
      #000;
}
body::before,
body::after{
    content:"";
    position:fixed;
    width:60vw;
    height:60vw;
    border-radius:50%;
    filter:blur(140px);
    opacity:0.5;
    z-index:-1;
}

body::before{
    background:#7c3aed;
    top:-20vh;
    left:-20vw;
    animation: float1 12s ease-in-out infinite;
}

body::after{
    background:#0ea5e9;
    bottom:-20vh;
    right:-20vw;
    animation: float2 14s ease-in-out infinite;
}

.stars{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    pointer-events:none;
    background:transparent;
    z-index:-2;
}

.stars::before,
.stars::after{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        radial-gradient(2px 2px at 10% 20%, white, transparent),
        radial-gradient(2px 2px at 30% 70%, white, transparent),
        radial-gradient(1px 1px at 60% 40%, white, transparent),
        radial-gradient(2px 2px at 80% 30%, white, transparent),
        radial-gradient(1px 1px at 90% 80%, white, transparent);

    opacity:0.4;
    animation: starsMove 40s linear infinite;

}

.stars::after{
    opacity:0.2;
    animation-duration: 120s;
}
   @keyframes float1{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(80px,60px) scale(1.2);}
}

@keyframes float2{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-80px,-60px) scale(1.25);}
}
@keyframes starsMove{
    from{
        transform: translateY(0);
    }
    to{
        transform: translateY(-300px);
    }
}
img{
    width:300px;
    margin:15px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,255,255,0.3);
    transition:0.3s;
}

img:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>
<div class="stars"></div>
<h1>Это мы 😎</h1>

<img src="https://raw.githubusercontent.com/dhdhd4024-commits/mysite/refs/heads/main/images/foto1%20.jpg" alt="Фото с GitHub">
<img src="https://raw.githubusercontent.com/dhdhd4024-commits/mysite/refs/heads/main/photo2.jpg" alt="Новая фотка с GitHub">
</body>
</html>
