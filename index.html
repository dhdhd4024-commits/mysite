<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Наш сайт</title>
<style>
body{
   margin:0;
min-height:100vh;
font-family:Arial;
color:white;
text-align:center;
overflow:hidden;
position:relative;

background:#0b0b10;
}
body::before,
body::after{
    content:"";
    position:absolute;
    width:450px;
    height:450px;
    border-radius:50%;
    filter:blur(120px);
    opacity:0.6;
    z-index:-1;
}

body::before{
    background:#ff2d55;
    top:-120px;
    left:-120px;
    animation: move1 10s ease-in-out infinite;
}

body::after{
    background:#0a84ff;
    bottom:-120px;
    right:-120px;
    animation: move2 12s ease-in-out infinite;
}

@keyframes move1{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(60px,40px) scale(1.2);}
    100%{transform:translate(0,0) scale(1);}
}

@keyframes move2{
    0%{transform:translate(0,0) scale(1);}
    50%{transform:translate(-60px,-40px) scale(1.2);}
    100%{transform:translate(0,0) scale(1);}
}
@keyframes gradient{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

img{
    width:300px;
    margin:15px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,255,255,0.3);
    transition:0.3s;
}

img:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>

<h1>Это мы 😎</h1>

<img src="photo1.jpg">
<img src="https://raw.githubusercontent.com/dhdhd4024-commits/mysite/refs/heads/main/images/foto1%20.jpg" alt="Фото с GitHub">
<img src="https://raw.githubusercontent.com/dhdhd4024-commits/mysite/refs/heads/main/photo2.jpg" alt="Новая фотка с GitHub">
</body>
</html>
