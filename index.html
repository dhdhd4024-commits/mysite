<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Наш сайт</title>
<style>
body{
    margin:0;
    min-height:100vh;
    color:white;
    text-align:center;
    font-family:Arial;

    background: linear-gradient(-45deg, #ff0000, #1e1e1e, #000000, #ff4444);
    background-size: 400% 400%;
    animation: gradient 10s ease infinite;
}

@keyframes gradient{
    0%{
        background-position:0% 50%;
    }
    50%{
        background-position:100% 50%;
    }
    100%{
        background-position:0% 50%;
    }
}

img{
    width:300px;
    margin:15px;
    border-radius:20px;
    box-shadow:0 0 20px rgba(255,255,255,0.3);
    transition:0.3s;
}

img:hover{
    transform:scale(1.05);
}
</style>
</head>
<body>

<h1>Это мы 😎</h1>

<img src="photo1.jpg">
<img src="https://raw.githubusercontent.com/dhdhd4024-commits/mysite/refs/heads/main/images/foto1%20.jpg" alt="Фото с GitHub">
<img src="https://raw.githubusercontent.com/dhdhd4024-commits/mysite/refs/heads/main/photo2.jpg" alt="Новая фотка с GitHub">
</body>
</html>
